const $=s=>document.querySelector(s);let data=JSON.parse($('#initial-data').textContent),token='',editing=null;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(s){return `<span class="badge ${/FAIL|失败/.test(s)?'fail':/PASS|通过/.test(s)?'pass':/BLOCK|暂停|待/.test(s)?'warn':''}">${e(s)}</span>`}
function link(path,label){if(!path)return '';const p=String(path);if(!/^(requirements|reports|docs)\//.test(p)||p.includes('..'))return e(label||p);return `<a href="${token?'/evidence/':'../'}${e(p)}" target="_blank" rel="noopener">${e(label||p)}</a>`}
function refs(s){return String(s||'').split(/(\[[^\]]+\]\([^)]+\))/g).map(v=>{const m=v.match(/^\[([^\]]+)\]\(([^)]+)\)$/);if(!m)return e(v);let p=m[2];if(p.startsWith('../'))p=p.slice(3);else p='requirements/'+p;return link(p,m[1])}).join('')}
function manual(row,channel){const m=row.manual[channel];return (m?`<div class="manual">${badge(m.status)}<br><small>人工修订 · ${e(m.author)}<br>${e(m.recorded_at)}<br>来源：${e(m.source)}<br>${e(m.reason)}</small></div>`:'')+`<button data-edit="${e(row.story)}" data-channel="${channel}" ${token?'':'disabled'}>修改${channel==='stage'?'阶段':'人工记录'}</button>`}

$('#count').textContent=`${rows.length} 个需求`;
$('#rows').innerHTML=rows.map(r=>{const autos=[...r.automatic].sort((a,b)=>String(b.time).localeCompare(String(a.time)));const a=autos[0];return `<tr><td><strong>${e(r.title)}</strong><p>${badge(r.stage)}</p>${manual(r,'stage')}<p><small>${e(r.release)}</small></p><details><summary>查看修订及证据历史（${r.history.length}）</summary>${r.history.map(h=>`<p>${badge(h.status||h.kind)}<br><small>${e(h.recorded_at)} · ${e(h.author||h.kind)}</small><pre>${e(JSON.stringify(h,null,2))}</pre></p>`).join('')||'<p>暂无新增记录；迁移来源见右列。</p>'}</details></td><td>${a?`${badge(a.status)}<br>${link(a.report,'最近一轮 API 报告')}<br><small>${e(a.environment)} · ${e(a.version)}<br>${e(a.time)}<br>仅所选 ${a.case_ids.length} 项，不代表全量验收</small>`:`<small>迁移时已有记录</small><p>${e(r.api_baseline)}</p>`}${manual(r,'api')}${autos.length>1?`<details><summary>历史 API 批次（${autos.length-1}）</summary>${autos.slice(1).map(h=>`<p>${badge(h.status)} ${link(h.report,h.run_id)}<br><small>${e(h.time)}</small></p>`).join('')}</details>`:''}</td><td><p>${e(r.ui_baseline)}</p>${manual(r,'ui')}<p><small>人工通过仅适用于注明的环境和范围。</small></p></td><td>${e(r.submission)}<p><strong>下一步</strong><br>${e(r.next)}</p>${refs(r.source)}<p><small>${e(r.baseline_source)}</small></p>${r.workflow.slice(-3).map(w=>`<p>${badge(w.status)}<br><small>${e((w.reasons||[]).join('；'))}</small><br>${link(w.source,'查看来源')}</p>`).join('')}</td></tr>`}).join('');}
async function refresh(){try{const res=await fetch('/api/status',{cache:'no-store'});if(!res.ok)throw Error('状态加载失败');const body=await res.json();data=body.data;token=body.token;$('#notice').textContent='本地状态已载入。人工修改保存到 SQLite，重启服务后仍保留；自动测试证据独立展示。';render()}catch(err){$('#notice').textContent='当前为离线快照。运行 npm run qa -- status --serve 后，可在本地页面修改并持久保存。';render()}}

$('#form').onsubmit=async ev=>{ev.preventDefault();$('#save').disabled=true;try{const body={...editing};for(const k of ['status','author','source','reason'])body[k]=$('#'+k).value;const res=await fetch('/api/manual',{method:'POST',headers:{'Content-Type':'application/json','X-QA-Token':token},body:JSON.stringify(body)});const value=await res.json();if(!res.ok)throw Error(value.error);$('#editor').close();await refresh()}catch(err){$('#error').textContent=err.message}finally{$('#save').disabled=false}};
