const $=s=>document.querySelector(s);let data=JSON.parse($('#initial-data').textContent),token='',editing=null;

async function refresh(){try{const res=await fetch('/api/status',{cache:'no-store'});if(!res.ok)throw Error('状态加载失败');const body=await res.json();data=body.data;token=body.token;$('#notice').textContent='本地状态已载入。人工修改保存到 SQLite，重启服务后仍保留；自动测试证据独立展示。';render()}catch(err){$('#notice').textContent='当前为离线快照。运行 npm run qa -- status --serve 后，可在本地页面修改并持久保存。';render()}}
