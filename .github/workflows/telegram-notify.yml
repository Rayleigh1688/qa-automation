
name: Telegram 代码更新通知

on:
  push:
    branches: [main]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 发送 Telegram 通知
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          commit = event.get("head_commit") or {}
          title = (commit.get("message") or "无提交说明").splitlines()[0][:500]
          text = (
              "【GitHub 代码更新】\n"
              f"仓库：{os.environ['GITHUB_REPOSITORY']}\n"
              f"分支：{os.environ['GITHUB_REF_NAME']}\n"
              f"推送人：{os.environ['GITHUB_ACTOR']}\n"
              f"最新提交：{os.environ['GITHUB_SHA'][:7]}\n"
              f"说明：{title}\n"
              f"查看变更：{event.get('compare', '')}"
          )

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          if not token or not chat_id:
              raise SystemExit("请配置 Telegram Secrets")

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=json.dumps({"chat_id": chat_id, "text": text}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          if not result.get("ok"):
              raise SystemExit("Telegram 发送失败")
          print("Telegram 通知已发送")
          PY
