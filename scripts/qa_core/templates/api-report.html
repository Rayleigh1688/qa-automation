<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>$title</title>
  <style>
    :root{color-scheme:light;--ink:#17233c;--muted:#536179;--line:#dce4ee;--panel:#f4f7fb;--blue:#164b91;--pass:#186747;--fail:#a52a3c}
    *{box-sizing:border-box}
    body{margin:0;background:#f0f4f9;color:var(--ink);font:15px/1.55 system-ui,sans-serif}
    main{max-width:1200px;margin:0 auto;padding:32px 24px 56px}
    h1,h2,h3,h4,p{margin:0}
    h1{font-size:clamp(25px,4vw,36px);line-height:1.2}
    h2{font-size:19px}h3{font-size:16px}h4{font-size:14px}
    a{color:var(--blue);font-weight:600;text-decoration-thickness:1px;text-underline-offset:3px}
    a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2673c3;outline-offset:2px}
    .masthead,.results{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}
    .masthead{padding:26px 28px;border-top:4px solid var(--blue)}
    .metadata{display:flex;flex-wrap:wrap;gap:10px 26px;margin:16px 0 0}
    .metadata dt{font-size:12px;color:var(--muted)}
    .metadata dd{margin:1px 0 0;font-weight:600;overflow-wrap:anywhere}
    .context:not(:empty){margin-top:13px;color:var(--muted)}
    .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0 22px}
    .metric{background:white;border:1px solid var(--line);border-radius:11px;padding:12px 17px}
    .metric span{display:block;color:var(--muted);font-size:13px}
    .metric strong{font-size:27px;line-height:1.3;font-variant-numeric:tabular-nums}
    .passed{color:var(--pass)}.failed{color:var(--fail)}
    .toolbar{padding:16px 19px;border-bottom:1px solid var(--line)}
    .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:11px}
    input,select{border:1px solid #a9b8ca;border-radius:7px;background:white;padding:8px 11px;color:var(--ink);font:inherit}
    input{flex:1;min-width:0}select{max-width:100%}
    .downloads{display:flex;gap:12px;flex-wrap:wrap;margin-left:auto;font-size:13px}
    .list-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 72px 71px;align-items:center;gap:14px;padding:12px 19px}
    .list-heading{background:var(--panel);color:var(--muted);font-size:12px;font-weight:650}
    .case+.case{border-top:1px solid var(--line)}
    summary{cursor:pointer}
    .case>summary{list-style:none}
    .case>summary::-webkit-details-marker{display:none}
    .case>summary:hover,.case[open]>summary{background:#f5f8fd}
    .case-label{display:grid;grid-template-columns:15px minmax(0,1fr);align-items:start;gap:4px;font-weight:650}
    .case-label::before{content:"▸";color:var(--blue)}
    .case[open] .case-label::before{content:"▾"}
    .case-key,.secondary{display:block;color:var(--muted);font-size:12px;font-weight:400;overflow-wrap:anywhere}
    .route{overflow-wrap:anywhere}
    .elapsed{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
    .badge{display:inline-block;width:max-content;border-radius:5px;background:#edf0f5;padding:2px 6px;font-weight:750;font-size:12px;white-space:nowrap}
    .PASS{background:#e5f4eb;color:var(--pass)}.FAIL{background:#fdebee;color:var(--fail)}
    .case-detail{padding:15px 19px 20px}
    .case-description{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
    .case-description p{margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
    .case-step{padding:13px;border:1px solid var(--line);border-radius:9px;margin:9px 0}
    .step-heading,.result-meta{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
    .step-heading h3{overflow-wrap:anywhere}
    .result-meta{margin:7px 0 10px;color:var(--muted);font-size:13px}
    .exchange{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
    .exchange>section{min-width:0}
    .exchange h4,.assertion-heading{margin:8px 0 5px}
    .exchange p,.empty,.evidence{color:var(--muted);font-size:13px}
    .response-findings{background:#fff5f6;border-left:3px solid var(--fail);margin:8px 0 10px;padding:7px 10px;font-size:13px}
    .response-findings h4{color:var(--fail);margin:0 0 4px}
    .response-findings ul{margin:0;padding-left:18px;overflow-wrap:anywhere}
    .empty{padding:15px 19px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere}
    .exchange pre,.technical pre{color:#20334f;background:var(--panel);border:1px solid var(--line);margin:4px 0;padding:9px;border-radius:6px;max-height:290px;overflow:auto}
    code,pre{font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace}
    .assertion-scroll{overflow:auto}
    table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.45;text-align:left}
    th,td{padding:8px;vertical-align:top;border-bottom:1px solid var(--line)}
    th{background:var(--panel);white-space:nowrap}
    td code,td small{overflow-wrap:anywhere}
    td pre{margin:0;font-size:12px;min-width:84px}
    td small{display:block;color:var(--muted);margin-top:2px}
    tr[data-check="FAIL"]{background:#fff5f6}
    .evidence{margin-top:10px;overflow-wrap:anywhere}
    [hidden]{display:none!important}
    @media(max-width:730px){
      main{padding:14px 10px 35px}
      .masthead{padding:17px 15px}.toolbar,.case-detail{padding:12px}
      .list-row{grid-template-columns:minmax(0,1fr) 55px 60px;gap:6px;padding:9px 12px}
      .list-heading span:nth-child(2){display:none}.list-row .route{grid-row:2;grid-column:1/-1;padding-left:19px}
      .exchange,.case-description{grid-template-columns:minmax(0,1fr)}
      .controls input{flex-basis:100%}
      .assertion-scroll table{min-width:520px}
      .metric{padding:8px 11px}.counts{gap:6px}
      .downloads{margin-left:0}
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <h1>$title</h1>
      <dl class="metadata">$metadata</dl>
      <div class="context">$context</div>
    </header>
    <section class="counts" aria-label="结果概览">
      <div class="metric"><span>接口判定</span><strong>$total</strong></div>
      <div class="metric"><span>通过</span><strong class="passed">$passed</strong></div>
      <div class="metric"><span>失败</span><strong class="failed">$failed</strong></div>
    </section>
    <section class="results" aria-labelledby="case-heading">
      <div class="toolbar">
        <h2 id="case-heading">接口用例</h2>
        <div class="controls">
          <input id="search" type="search" aria-label="搜索用例" placeholder="搜索编号、接口、断言字段">
          <select id="status" aria-label="执行结果">
            <option value="">全部结果</option>
            <option value="FAIL">失败</option>
            <option value="PASS">通过</option>
          </select>
          <nav class="downloads" aria-label="下载">$downloads</nav>
        </div>
      </div>
      <div class="list-row list-heading" aria-hidden="true">
        <span>用例</span><span>接口</span><span>结果</span><span>用例耗时</span>
      </div>
      $cases
      <p id="no-matches" class="empty" role="status" hidden>没有符合筛选条件的用例。</p>
    </section>
  </main>
  <script>
    const search = document.getElementById('search');
    const status = document.getElementById('status');
    const cases = Array.from(document.querySelectorAll('.case'));
    function filter() {
      const query = search.value.trim().toLowerCase();
      let shown = 0;
      for (const item of cases) {
        const match = (!status.value || item.dataset.status === status.value)
          && item.textContent.toLowerCase().includes(query);
        item.hidden = !match;
        if (match) shown += 1;
      }
      document.getElementById('no-matches').hidden = !cases.length || shown > 0;
    }
    search.addEventListener('input', filter);
    status.addEventListener('change', filter);
  </script>
</body>
</html>
