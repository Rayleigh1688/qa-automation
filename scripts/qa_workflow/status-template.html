<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求测试状态</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172638;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1500px;margin:auto;padding:32px}h1{font-size:30px;margin:0}header p{color:#56677a;margin:8px 0 20px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}input,select,textarea,button{font:inherit;border:1px solid #c7d1dc;border-radius:6px;padding:8px;background:white}button{cursor:pointer;color:#174b80}button.primary{background:#174b80;color:white}button:disabled{opacity:.5;cursor:default}.table{overflow:auto;background:white;border:1px solid #dce3ea;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:1050px}th,td{text-align:left;vertical-align:top;padding:16px;border-bottom:1px solid #e3e8ed}th{background:#eef2f7;font-size:13px;color:#53647a}td{min-width:190px}td:first-child{min-width:240px}small,.muted{color:#65768b;font-size:13px}a{color:#205a93;overflow-wrap:anywhere}.badge{display:inline-block;border-radius:5px;padding:2px 8px;background:#edf1f5;font-weight:600;margin-bottom:6px}.fail{background:#fce7e5;color:#972d29}.pass{background:#e2f3eb;color:#176046}.warn{background:#fff0cd;color:#7d5914}.manual{border-left:3px solid #6389b5;padding-left:10px;margin:12px 0}.notice{padding:12px 16px;background:#e8eef6;border-radius:8px}details{margin-top:12px}summary{cursor:pointer;color:#285985}dialog{width:min(560px,95vw);border:0;border-radius:12px;padding:26px;box-shadow:0 10px 50px #0004}dialog::backdrop{background:#10223880}label{display:block;margin:12px 0}label input,label select,label textarea{display:block;width:100%;margin-top:4px}.actions{display:flex;justify-content:flex-end;gap:10px}.error{color:#a02622}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 system-ui}footer{margin-top:20px;color:#65768b}@media(max-width:700px){main{padding:16px}h1{font-size:24px}}
</style></head><body><main><header><h1>需求测试状态</h1><p>API 自动执行与 UI 人工验收分别记录。每次修改保留来源，每轮测试保留证据。</p></header>
<div class="notice" id="notice">载入状态…</div><div class="toolbar"><input id="search" aria-label="搜索需求" placeholder="搜索需求编号或名称"><select id="filter" aria-label="筛选"><option value="all">全部需求</option><option value="failure">有 API 失败</option><option value="manual">待 UI 人工验证</option><option value="paused">暂停需求</option></select><button id="refresh">刷新证据</button><span id="count"></span></div>
<div class="table"><table><thead><tr><th>需求 / 阶段</th><th>API 测试状态</th><th>UI 手工测试状态</th><th>提测 / 下一步 / 来源</th></tr></thead><tbody id="rows"></tbody></table></div><footer>2022 继续暂停。BUG 先生成 HTML 报告，具体清单确认后才建单。本页编辑仅更新本地状态，不触发测试或 Jira 操作。</footer></main>
<dialog id="editor"><form id="form"><h2 id="edit-title">修改状态</h2><label>状态<input id="status" required maxlength="2000" list="states"><datalist id="states"><option>待测试</option><option>测试中</option><option>通过（注明环境和范围）</option><option>失败</option><option>阻塞</option><option>暂停</option></datalist></label><label>修改人<input id="author" required maxlength="2000"></label><label>来源 / 证据<input id="source" required maxlength="2000" placeholder="用户确认、人工批次、文档或报告路径"></label><label>原因与环境 / 范围<textarea id="reason" required maxlength="2000" rows="3"></textarea></label><p id="error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" id="save">保存并保留历史</button></div></form></dialog>
<script id="initial-data" type="application/json">__INITIAL_DATA__</script><script>
const $=s=>document.querySelector(s);let data=JSON.parse($('#initial-data').textContent),token='',editing=null;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(s){return `<span class="badge ${/FAIL|失败/.test(s)?'fail':/PASS|通过/.test(s)?'pass':/BLOCK|暂停|待/.test(s)?'warn':''}">${e(s)}</span>`}
function link(path,label){if(!path)return '';const p=String(path);if(!/^(requirements|reports|docs)\//.test(p)||p.includes('..'))return e(label||p);return `<a href="${token?'/evidence/':'../'}${e(p)}" target="_blank" rel="noopener">${e(label||p)}</a>`}
function refs(s){return String(s||'').split(/(\[[^\]]+\]\([^)]+\))/g).map(v=>{const m=v.match(/^\[([^\]]+)\]\(([^)]+)\)$/);if(!m)return e(v);let p=m[2];if(p.startsWith('../'))p=p.slice(3);else p='requirements/'+p;return link(p,m[1])}).join('')}
function manual(row,channel){const m=row.manual[channel];return (m?`<div class="manual">${badge(m.status)}<br><small>人工修订 · ${e(m.author)}<br>${e(m.recorded_at)}<br>来源：${e(m.source)}<br>${e(m.reason)}</small></div>`:'')+`<button data-edit="${e(row.story)}" data-channel="${channel}" ${token?'':'disabled'}>修改${channel==='stage'?'阶段':'人工记录'}</button>`}
function render(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;const rows=data.requirements.filter(r=>(r.title.toLowerCase().includes(q))&&(f==='all'||f==='paused'&&r.story==='ISOP-2022'||f==='failure'&&(r.automatic.some(a=>a.status==='FAIL')||r.api_baseline.includes('失败'))||f==='manual'&&!/通过/.test(r.manual.ui?.status||r.ui_baseline)));
$('#count').textContent=`${rows.length} 个需求`;
$('#rows').innerHTML=rows.map(r=>{const autos=[...r.automatic].sort((a,b)=>String(b.time).localeCompare(String(a.time)));const a=autos[0];return `<tr><td><strong>${e(r.title)}</strong><p>${badge(r.stage)}</p>${manual(r,'stage')}<p><small>${e(r.release)}</small></p><details><summary>查看修订及证据历史（${r.history.length}）</summary>${r.history.map(h=>`<p>${badge(h.status||h.kind)}<br><small>${e(h.recorded_at)} · ${e(h.author||h.kind)}</small><pre>${e(JSON.stringify(h,null,2))}</pre></p>`).join('')||'<p>暂无新增记录；迁移来源见右列。</p>'}</details></td><td>${a?`${badge(a.status)}<br>${link(a.report,'最近一轮 API 报告')}<br><small>${e(a.environment)} · ${e(a.version)}<br>${e(a.time)}<br>仅所选 ${a.case_ids.length} 项，不代表全量验收</small>`:`<small>迁移时已有记录</small><p>${e(r.api_baseline)}</p>`}${manual(r,'api')}${autos.length>1?`<details><summary>历史 API 批次（${autos.length-1}）</summary>${autos.slice(1).map(h=>`<p>${badge(h.status)} ${link(h.report,h.run_id)}<br><small>${e(h.time)}</small></p>`).join('')}</details>`:''}</td><td><p>${e(r.ui_baseline)}</p>${manual(r,'ui')}<p><small>人工通过仅适用于注明的环境和范围。</small></p></td><td>${e(r.submission)}<p><strong>下一步</strong><br>${e(r.next)}</p>${refs(r.source)}<p><small>${e(r.baseline_source)}</small></p>${r.workflow.slice(-3).map(w=>`<p>${badge(w.status)}<br><small>${e((w.reasons||[]).join('；'))}</small><br>${link(w.source,'查看来源')}</p>`).join('')}</td></tr>`}).join('');}
async function refresh(){try{const res=await fetch('/api/status',{cache:'no-store'});if(!res.ok)throw Error('状态加载失败');const body=await res.json();data=body.data;token=body.token;$('#notice').textContent='本地状态已载入。人工修改保存到 SQLite，重启服务后仍保留；自动测试证据独立展示。';render()}catch(err){$('#notice').textContent='当前为离线快照。运行 npm run qa -- status --serve 后，可在本地页面修改并持久保存。';render()}}
$('#rows').onclick=ev=>{const b=ev.target.closest('[data-edit]');if(!b)return;const row=data.requirements.find(r=>r.story===b.dataset.edit),m=row.manual[b.dataset.channel];editing={story:row.story,channel:b.dataset.channel,base_revision:m?.revision||0};$('#edit-title').textContent=row.story+' · '+({api:'API 人工记录',ui:'UI 手工测试',stage:'需求阶段'}[editing.channel]);for(const k of ['status','author','source','reason'])$('#'+k).value=m?.[k]||'';$('#error').textContent='';$('#editor').showModal()};
$('#form').onsubmit=async ev=>{ev.preventDefault();$('#save').disabled=true;try{const body={...editing};for(const k of ['status','author','source','reason'])body[k]=$('#'+k).value;const res=await fetch('/api/manual',{method:'POST',headers:{'Content-Type':'application/json','X-QA-Token':token},body:JSON.stringify(body)});const value=await res.json();if(!res.ok)throw Error(value.error);$('#editor').close();await refresh()}catch(err){$('#error').textContent=err.message}finally{$('#save').disabled=false}};
$('#cancel').onclick=()=>$('#editor').close();$('#refresh').onclick=refresh;$('#search').oninput=render;$('#filter').onchange=render;render();if(location.protocol==='http:'||location.protocol==='https:')refresh();else $('#notice').textContent='离线快照：运行 npm run qa -- status --serve 后，可修改并保存状态。';
</script></body></html>
